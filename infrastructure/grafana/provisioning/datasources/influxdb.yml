apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: iiot_org
      defaultBucket: iiot_bucket
      tlsSkipVerify: true
    secureJsonData:
      token: iiot_token
